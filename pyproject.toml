[project]
name = "atlas-research"
version = "1.0.0"
description = "ATLAS: local-first research facility (search, evidence tracking, cited reports)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "pypdf>=4.0",
]

[project.optional-dependencies]
# Only needed for the optional onion/Tor module (SOCKS proxy support).
onion = ["httpx[socks]>=0.27,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "bandit>=1.7"]

[tool.uv]
package = false          # an application, not a library: nothing to build or install

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
